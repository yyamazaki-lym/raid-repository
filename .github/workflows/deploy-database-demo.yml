# Deploy Database (Demo)
#
# Auto-applies supabase/schema.sql AND supabase/seed-demo.sql to the demo
# Supabase project on every main push that touches either file. seed-demo.sql
# is idempotent (sentinel `app_settings.demo_seed_applied='1'` + URL NOT EXISTS
# guards), so repeated runs are safe.
#
# Setup (upstream repo only): register a GitHub Actions secret
# `SUPABASE_DB_URL_DEMO` with the demo project's Session pooler URI. Fork
# repos without the secret skip silently — only the upstream repo (or any
# other repo intentionally configured for a demo deploy) ever runs this.
#
# Production / actual fork repos should NOT register this secret. Their main
# Supabase is updated via deploy-database.yml (schema.sql only).

name: Deploy Database (Demo)

on:
  push:
    branches: [main]
    paths:
      - 'supabase/schema.sql'
      - 'supabase/seed-demo.sql'
      - '.github/workflows/deploy-database-demo.yml'
  workflow_dispatch:

jobs:
  deploy-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Skip if SUPABASE_DB_URL_DEMO not configured
        id: guard
        env:
          SUPABASE_DB_URL_DEMO: ${{ secrets.SUPABASE_DB_URL_DEMO }}
        run: |
          if [ -z "$SUPABASE_DB_URL_DEMO" ]; then
            echo "Skipping: SUPABASE_DB_URL_DEMO secret not set."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # 2026-08-05 セキュリティ監査 H-2: schema.sql は既定で SELECT を
      # `TO authenticated` に閉じる。公開デモは匿名訪問者が anon key で読む
      # 前提なので、このプロジェクトだけ `app.public_demo` を立てて anon
      # SELECT を残す (schema.sql の §7-0 が読むフラグ)。
      #
      # このワークフローは SUPABASE_DB_URL_DEMO secret が登録された
      # プロジェクト = デモ環境でしか走らないので、ここで設定するのが
      # 「本番に絶対混入しない」最も安全な置き場所になる。
      #
      # ⚠ フラグは **セッション変数** として schema.sql と同一接続で渡す。
      #   - `ALTER DATABASE ... SET` は Supabase の postgres ロールが
      #     superuser でないため `permission denied to set parameter` で失敗する
      #     (2026-08-05 の初回デプロイで実際に踏んだ)。
      #   - そもそもこのフラグは schema.sql の §7-0 が **適用時に 1 度読むだけ**
      #     で、アプリのランタイムは参照しない (生成された policy が永続する)。
      #     永続設定にする必要がない。
      #   - psql は複数の -c / -f を **同一セッションで順に**実行するので、
      #     先頭の SET が後続の -f から見える。DB に痕跡も残らない。
      - name: Apply supabase/schema.sql (public demo mode)
        if: steps.guard.outputs.skip == 'false'
        env:
          SUPABASE_DB_URL_DEMO: ${{ secrets.SUPABASE_DB_URL_DEMO }}
        run: |
          psql "$SUPABASE_DB_URL_DEMO" \
            -v ON_ERROR_STOP=1 \
            --single-transaction \
            -c "SET app.public_demo = 'true';" \
            -f supabase/schema.sql

      - name: Verify anon SELECT is enabled on demo
        if: steps.guard.outputs.skip == 'false'
        env:
          SUPABASE_DB_URL_DEMO: ${{ secrets.SUPABASE_DB_URL_DEMO }}
        run: |
          # 反映漏れはデモサイトが空になる形で表面化するので、ここで落とす。
          n=$(psql "$SUPABASE_DB_URL_DEMO" -tAc "
            SELECT count(*) FROM pg_policies
            WHERE schemaname='public' AND cmd='SELECT' AND 'anon' = ANY(roles);")
          echo "anon SELECT policies: $n"
          if [ "$n" -eq 0 ]; then
            echo "::error::app.public_demo が効いていません (anon SELECT ポリシーが 0 本)。デモサイトが読めなくなります。"
            exit 1
          fi

      # 2026-10-08 (2026-10-07 セキュリティ精査の残り) の回帰ガード。公開デモでは、
      # 重い集計の RPC を anon にも authenticated にも配らない (service_role だけ)。
      # デモの表は全行が誰にでも読めるので、配ると部外者が回数の制限なく
      # 全期間の集計を回せる。schema.sql 13c-4 と 15 章の 2 つ目のループ。
      - name: Verify heavy aggregate RPCs are service-role only on demo
        if: steps.guard.outputs.skip == 'false'
        env:
          SUPABASE_DB_URL_DEMO: ${{ secrets.SUPABASE_DB_URL_DEMO }}
        run: |
          rows=$(psql "$SUPABASE_DB_URL_DEMO" -tAc "
            SELECT coalesce(string_agg(f || ':' || r, ', '), '')
              FROM unnest(ARRAY[
                'public.category_progress_by_day(integer)',
                'public.fflogs_duplicate_pulls(bigint)',
                'public.practice_seconds_by_category()',
                'public.fflogs_report_days(bigint)',
                'public.fflogs_report_duplicate_pulls(bigint)'
              ]) AS f
             CROSS JOIN unnest(ARRAY['anon', 'authenticated']) AS r
             WHERE has_function_privilege(r, f::regprocedure, 'EXECUTE');")
          echo "heavy RPC EXECUTE for anon/authenticated on demo: '${rows}'"
          if [ -n "$rows" ]; then
            echo "::error::公開デモで重い集計の RPC が anon / authenticated に配られています (${rows})。schema.sql 15 章の 2 つ目のループと 13c-4 を確認してください。"
            exit 1
          fi

      # 2026-10-01 監査 C-3 の回帰ガード。公開デモ DB は HTTP を叩く pg_cron
      # ジョブを持たない (以前は本番の route を毎時・5 分毎に叩いていた)。
      # schema.sql 13-0 が app.public_demo を見て外すので、残っていたら落とす。
      - name: Verify demo has no HTTP cron jobs
        if: steps.guard.outputs.skip == 'false'
        env:
          SUPABASE_DB_URL_DEMO: ${{ secrets.SUPABASE_DB_URL_DEMO }}
        run: |
          jobs=$(psql "$SUPABASE_DB_URL_DEMO" -tAc "
            SELECT coalesce(string_agg(jobname, ', '), '') FROM cron.job
            WHERE command ILIKE '%net.http_get%';")
          echo "HTTP cron jobs on demo: '${jobs}'"
          if [ -n "$jobs" ]; then
            echo "::error::公開デモ DB に本番を叩く pg_cron ジョブが残っています (${jobs})。"
            exit 1
          fi

      - name: Apply supabase/seed-demo.sql
        if: steps.guard.outputs.skip == 'false'
        env:
          SUPABASE_DB_URL_DEMO: ${{ secrets.SUPABASE_DB_URL_DEMO }}
        run: |
          psql "$SUPABASE_DB_URL_DEMO" \
            -v ON_ERROR_STOP=1 \
            --single-transaction \
            -f supabase/seed-demo.sql
