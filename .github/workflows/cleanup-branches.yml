# リモートブランチの削除 (2026-09-06)。
#
# Claude Code のリモート実行環境は git の push 経路がブランチ削除を受け付けず
# (`git push --delete` が "Everything up-to-date" で無視される)、GitHub API への
# 直接アクセスも無いため、削除だけが残っていた。GitHub Actions の GITHUB_TOKEN
# (contents: write) はブランチ (ref) を消せるので、手動実行 (workflow_dispatch)
# で「名前を列挙して消す」導線を用意する。
#
# 安全弁:
#   - `main` と、実行中のワークフロー自身の ref は絶対に消さない
#   - 既定は dry_run=true (消す予定のリストだけ出す)。実際に消すときは false
#   - 存在しないブランチは警告して続行 (途中で止まらない)
#
# 使い方 (Actions タブ > "Cleanup branches" > Run workflow):
#   branches: 改行またはカンマ区切りのブランチ名 (refs/heads/ は不要)
#   dry_run:  最初は true で確認 → false で実行
name: Cleanup branches

on:
  workflow_dispatch:
    inputs:
      branches:
        description: "削除するブランチ名 (改行 / カンマ区切り)"
        required: true
        type: string
      dry_run:
        description: "true なら一覧のみ表示して削除しない"
        required: true
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: cleanup-branches
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Delete listed branches
        uses: actions/github-script@v7
        env:
          BRANCHES: ${{ inputs.branches }}
          DRY_RUN: ${{ inputs.dry_run }}
        with:
          script: |
            const protectedNames = new Set(["main", "master", process.env.GITHUB_REF_NAME]);
            const names = process.env.BRANCHES
              .split(/[\n,]/)
              .map((s) => s.trim().replace(/^refs\/heads\//, ""))
              .filter(Boolean);
            const dryRun = process.env.DRY_RUN !== "false";
            const { owner, repo } = context.repo;
            core.info(`${dryRun ? "[dry run] " : ""}${names.length} branch(es) requested`);
            let deleted = 0, skipped = 0, missing = 0;
            for (const name of names) {
              if (protectedNames.has(name)) {
                core.warning(`skip protected: ${name}`);
                skipped += 1;
                continue;
              }
              try {
                await github.rest.repos.getBranch({ owner, repo, branch: name });
              } catch (e) {
                if (e.status === 404) {
                  core.warning(`not found: ${name}`);
                  missing += 1;
                  continue;
                }
                throw e;
              }
              if (dryRun) {
                core.info(`would delete: ${name}`);
                continue;
              }
              await github.rest.git.deleteRef({ owner, repo, ref: `heads/${name}` });
              core.info(`deleted: ${name}`);
              deleted += 1;
            }
            await core.summary
              .addHeading(dryRun ? "Cleanup branches (dry run)" : "Cleanup branches")
              .addTable([
                [{ data: "requested", header: true }, { data: "deleted", header: true }, { data: "skipped (protected)", header: true }, { data: "not found", header: true }],
                [String(names.length), String(deleted), String(skipped), String(missing)],
              ])
              .write();
