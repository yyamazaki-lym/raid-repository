# CI (Lint + Typecheck)
#
# main への push と全 PR で ESLint と TypeScript の型チェックを実行する。
# これまで lint/型チェックを CI で回しておらず、react-hooks 系の error が
# 蓄積していた (2026-06-11 セキュリティ監査で検出)。
#
# ESLint の既存違反 (react-hooks 系 39 件) は `eslint-suppressions.json` に
# 記録して抑制済みなので、このジョブが fail するのは「新規に増えた error」
# だけ。運用:
#   - 既存違反を実際に直したら `npx eslint --prune-suppressions` で解消分を
#     suppressions から除く (残したままだと unused 扱いで eslint が exit 2 を
#     返し CI が fail する)
#   - 新たに意図的な抑制を増やす場合のみ `npx eslint --suppress-all`
# warning (no-unused-vars 等) は exit code に影響しないので fail しない。

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npx eslint

      - name: TypeScript typecheck
        run: npx tsc --noEmit

      # scripts/check-*.mjs を全部回す (2026-09-07)。
      #
      # 内訳は 3 種類:
      #   - 更新履歴の構造検査 (check-changelog): changelog.ts が最新 1 件だけを
      #     持つこと (古い分は changelog-archive.ts へ graduate) / version|date の
      #     重複なし / 新→古の並び / release-notes の md と part title の一致
      #   - 純関数の契約検査 (check-fflogs-category, check-fflogs-fight-detail,
      #     check-content-groups, check-attendance-times, ...): 対象の .ts を
      #     `npx tsc` で単体コンパイルして実データ相当の入力を通す
      #   - 予算・回帰ガード (check-fights-payload): 明細の転送量が上限の根拠を
      #     超えていないか
      #   - SQL の静的照合 (check-seed-sql): seed-demo.sql は CI で **実行され
      #     ない** (適用は main push 後の deploy-database-demo.yml) ので、
      #     列名と ON CONFLICT の列組を schema.sql と突き合わせる
      #
      # 以前は changelog だけを CI で回していたため、他はローカルで走らせ忘れる
      # と壊れたまま通ってしまっていた。1 本でも落ちたらジョブを失敗させる。
      - name: Pure-function and structure checks
        run: |
          status=0
          for f in scripts/check-*.mjs; do
            echo "::group::$f"
            node "$f" || status=1
            echo "::endgroup::"
          done
          exit $status
