# Deploy Database (Production)
#
# Auto-applies supabase/schema.sql to the linked Supabase project on every
# main push that touches the file. Idempotent (CREATE/ALTER ... IF NOT EXISTS),
# so repeated runs are safe.
#
# Setup (per fork): register a GitHub Actions secret `SUPABASE_DB_URL` with
# your Supabase Session pooler URI (Settings -> Database -> Connection string
# -> Session pooler). Forks without the secret skip silently — no red marks.
#
# This workflow does NOT run supabase/seed-demo.sql. Demo seed is handled by
# deploy-database-demo.yml on the upstream repo only.

name: Deploy Database (Production)

on:
  push:
    branches: [main]
    paths:
      - 'supabase/schema.sql'
      - '.github/workflows/deploy-database.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Skip if SUPABASE_DB_URL not configured
        id: guard
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "Skipping: SUPABASE_DB_URL secret not set on this fork."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # 2026-10-01 監査 C-3 / F-5: pg_cron が叩く本番 URL は schema.sql に
      # 直書きしない。repository variable `CRON_BASE_URL`
      # (例 https://<project>.vercel.app) があれば app.cron_base_url として
      # 同一セッションで渡す。無ければ schema.sql 13-0 が既存ジョブの宛先を
      # 引き継ぐ (上流の本番はこちら)。fork は初回に必ず設定する
      # (docs/setup.md の手順 10)。
      - name: Apply supabase/schema.sql
        if: steps.guard.outputs.skip == 'false'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          CRON_BASE_URL: ${{ vars.CRON_BASE_URL }}
        run: |
          set -- -v ON_ERROR_STOP=1 --single-transaction
          if [ -n "$CRON_BASE_URL" ]; then
            # SQL に埋め込むので、引用符を含み得ない形だけを通す。
            if ! printf '%s' "$CRON_BASE_URL" | grep -Eq '^https://[A-Za-z0-9.-]+(:[0-9]+)?/?$'; then
              echo "::error::CRON_BASE_URL は https://<ホスト名> の形で設定してください (パスは付けない)。"
              exit 1
            fi
            echo "app.cron_base_url = ${CRON_BASE_URL}"
            set -- "$@" -c "SET app.cron_base_url = '${CRON_BASE_URL}';"
          fi
          psql "$SUPABASE_DB_URL" "$@" -f supabase/schema.sql

      # 2026-08-05 セキュリティ監査 H-2 の回帰ガード。
      #
      # 本番では anon SELECT が 1 本も存在しないのが正。`app.public_demo` は
      # デモ専用フラグ (deploy-database-demo.yml が設定する) で、本番 DB に
      # 誤って立つと 19 テーブル全部が未認証読み取り可能に戻る — しかも
      # 「サイトは正常に見える」ので気付けない。デプロイ時に必ず検知する。
      - name: Assert anon SELECT stays closed
        if: steps.guard.outputs.skip == 'false'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          n=$(psql "$SUPABASE_DB_URL" -tAc "
            SELECT count(*) FROM pg_policies
            WHERE schemaname='public' AND cmd='SELECT' AND 'anon' = ANY(roles);")
          flag=$(psql "$SUPABASE_DB_URL" -tAc "
            SELECT coalesce(current_setting('app.public_demo', true), '');")
          echo "anon SELECT policies: $n / app.public_demo: '${flag}'"
          if [ "$n" -ne 0 ]; then
            echo "::error::本番 DB で anon SELECT ポリシーが ${n} 本検出されました。app.public_demo が立っている可能性があります (RESET してください: ALTER DATABASE <db> RESET app.public_demo)。"
            exit 1
          fi

      # 2026-09-09 監査 M-A の回帰ガード。
      #
      # 上のガードは *ポリシー* しか数えないので、`SECURITY DEFINER` 関数に
      # anon EXECUTE が付いていると素通りする。DEFINER は定義者権限で走る =
      # RLS を bypass するため、この 1 本で anon SELECT の締め出しが丸ごと
      # 迂回できる (実際に category_progress_by_day がそうなっていた)。
      - name: Assert anon EXECUTE on SECURITY DEFINER functions stays closed
        if: steps.guard.outputs.skip == 'false'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          rows=$(psql "$SUPABASE_DB_URL" -tAc "
            SELECT string_agg(p.oid::regprocedure::text, ', ')
              FROM pg_proc p
              JOIN pg_namespace n ON n.oid = p.pronamespace
             WHERE n.nspname = 'public'
               AND p.prosecdef
               AND has_function_privilege('anon', p.oid, 'EXECUTE');")
          echo "anon EXECUTE on SECURITY DEFINER: '${rows}'"
          if [ -n "$rows" ]; then
            echo "::error::本番 DB で SECURITY DEFINER 関数に anon EXECUTE が付いています (${rows})。RLS を bypass するため、schema.sql 15 章の条件付き GRANT が効いているか確認してください。"
            exit 1
          fi

      # 2026-10-01 監査 S-9 の回帰ガード。
      #
      # 書き込み (INSERT / UPDATE / DELETE / ALL) のポリシーで USING (true) /
      # WITH CHECK (true) = 「ログインしていれば誰でも全行を書ける」を 0 本に
      # 保つ。schema.sql 側は scripts/check-rls-enabled.mjs が静的に見ているが、
      # ダッシュボードで足したポリシーは schema に現れないので、適用後の実 DB でも
      # 確かめる。
      - name: Assert no write policy allows everyone
        if: steps.guard.outputs.skip == 'false'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          rows=$(psql "$SUPABASE_DB_URL" -tAc "
            SELECT coalesce(string_agg(tablename || '.' || policyname, ', '), '')
              FROM pg_policies
             WHERE schemaname = 'public'
               AND cmd IN ('INSERT', 'UPDATE', 'DELETE', 'ALL')
               AND (coalesce(qual, '') = 'true' OR coalesce(with_check, '') = 'true');")
          echo "write policies with true: '${rows}'"
          if [ -n "$rows" ]; then
            echo "::error::本番 DB に誰でも書ける書き込みポリシーがあります (${rows})。"
            exit 1
          fi
