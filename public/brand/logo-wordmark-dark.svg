<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 176" width="720" height="176" role="img" aria-label="Raid Repository">
  <title>Raid Repository</title>
  
  <g transform="translate(16 16) scale(0.5625)">
<defs>
    <linearGradient id="rr-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101a2b"/>
      <stop offset="1" stop-color="#0a111d"/>
    </linearGradient>
    <linearGradient id="rr-crystal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c7f0ff"/>
      <stop offset="0.5" stop-color="#6fd3f2"/>
      <stop offset="1" stop-color="#2b8fc4"/>
    </linearGradient>
    <linearGradient id="rr-facet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
    <radialGradient id="rr-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6fd3f2" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#6fd3f2" stop-opacity="0"/>
    </radialGradient>
    <filter id="rr-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>

  <!-- vault tile -->
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#rr-bg)"/>
  <rect x="8.75" y="8.75" width="238.5" height="238.5" rx="55.25" fill="none" stroke="#6fd3f2" stroke-opacity="0.35" stroke-width="1.5"/>

  <!-- ambient glow behind the crystal -->
  <circle cx="128" cy="128" r="92" fill="url(#rr-glow)"/>

  <!-- party ring (orbit) -->
  <circle cx="128" cy="128" r="96" fill="none" stroke="#6fd3f2" stroke-opacity="0.22" stroke-width="1.5" stroke-dasharray="3 6"/>

  <!-- crystal -->
  <g filter="url(#rr-soft)" opacity="0.6">
    <polygon points="128,60 170,88 170,168 128,196 86,168 86,88" fill="#6fd3f2"/>
  </g>
  <polygon points="128,60 170,88 170,168 128,196 86,168 86,88" fill="url(#rr-crystal)"/>
  <!-- facets -->
  <polygon points="128,60 170,88 128,116 86,88" fill="url(#rr-facet)"/>
  <polyline points="128,60 128,196" fill="none" stroke="#ffffff" stroke-opacity="0.45" stroke-width="1.5"/>
  <polyline points="86,88 128,116 170,88" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1.5"/>
  <polyline points="86,168 128,140 170,168" fill="none" stroke="#0a3550" stroke-opacity="0.35" stroke-width="1.5"/>
  <polygon points="128,60 170,88 170,168 128,196 86,168 86,88" fill="none" stroke="#e6f9ff" stroke-opacity="0.7" stroke-width="2"/>

  <!-- eight-member party: tanks (top, blue) / healers (bottom, green) / DPS (sides, red) -->
  <g stroke="#0a111d" stroke-width="2">
    <circle cx="91.3" cy="39.3" r="9" fill="#5b9dff"/>
    <circle cx="164.7" cy="39.3" r="9" fill="#5b9dff"/>
    <circle cx="91.3" cy="216.7" r="9" fill="#57d38c"/>
    <circle cx="164.7" cy="216.7" r="9" fill="#57d38c"/>
    <circle cx="216.7" cy="91.3" r="9" fill="#ff6b7a"/>
    <circle cx="216.7" cy="164.7" r="9" fill="#ff6b7a"/>
    <circle cx="39.3" cy="91.3" r="9" fill="#ff6b7a"/>
    <circle cx="39.3" cy="164.7" r="9" fill="#ff6b7a"/>
  </g>

  </g>
  <g font-family="'Inter','Segoe UI','Helvetica Neue',Arial,'Noto Sans',sans-serif">
    <text x="188" y="86" font-size="52" font-weight="800" fill="#eaf6fb" textLength="504" lengthAdjust="spacingAndGlyphs">RAID REPOSITORY</text>
    <text x="190" y="126" font-size="18" font-weight="500" fill="#6fd3f2" textLength="330" lengthAdjust="spacingAndGlyphs">FFXIV STATIC PORTAL</text>
  </g>
</svg>
